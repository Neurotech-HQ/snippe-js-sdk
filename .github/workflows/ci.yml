name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18.x", "20.x"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # vitest 4 needs Node 20+. Node 18 still gets install, typecheck and build.
      - name: Run tests with coverage
        if: matrix.node != '18.x'
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Unit tests import src/, so only this catches a package that won't load.
      - name: Load the built package (CJS and ESM)
        run: |
          node -e "require('@snippe/sdk')"
          node --input-type=module -e "import '@snippe/sdk'"

      - name: Upload coverage artifact
        if: matrix.node == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
